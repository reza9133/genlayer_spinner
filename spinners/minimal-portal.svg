<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  width="24"
  height="24"
  role="img"
  aria-label="Loading"
  class="gl-portal"
>
  <!--
    GenLayer Spinner — Concept C: "Minimal Portal"
    One element, one gradient arc, one animation. Built on a 24px grid
    so it stays pixel-crisp at 16px in a button and reads cleanly at
    96px+ too — the whole family compressed to its simplest form.
    Uses the gl-a / gl-b custom properties (not currentColor) so it can
    sit inside colored buttons and badges without fighting the UI.
  -->
  <defs>
    <linearGradient id="gl-portal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--gl-a, #7A40FF)" />
      <stop offset="100%" stop-color="var(--gl-b, #00F5D4)" />
    </linearGradient>
  </defs>
  <circle
    class="gl-portal-ring"
    cx="12" cy="12" r="9"
    fill="none"
    stroke="url(#gl-portal-grad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="42.4 14.1"
  />
  <style>
    .gl-portal-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: gl-portal-spin calc(var(--gl-duration, 1.6s) * 0.6) linear infinite;
    }
    @keyframes gl-portal-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .gl-portal-ring { animation-duration: 1.6s; }
    }
  </style>
</svg>
