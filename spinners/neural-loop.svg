<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="96"
  height="96"
  role="img"
  aria-label="Loading — GenLayer Neural Loop"
  class="gl-neural"
>
  <!--
    GenLayer Spinner — Concept B: "Neural Loop"
    Three nodes (validators) held on a single unbroken loop (the contract).
    A gradient stream continuously travels the path (inference flowing
    through consensus) while the loop itself breathes between an organic
    curve and a tighter geometric one — AI intuition meeting blockchain
    structure on the same track.
  -->
  <defs>
    <linearGradient id="gl-neural-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="var(--gl-a, #7A40FF)" />
      <stop offset="50%"  stop-color="var(--gl-b, #00F5D4)" />
      <stop offset="100%" stop-color="var(--gl-a, #7A40FF)" />
    </linearGradient>
    <filter id="gl-neural-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- static reference track -->
  <path
    class="gl-neural-track"
    d="M50,18 A40,40 0 0,1 77.71,66 A40,40 0 0,1 22.29,66 A40,40 0 0,1 50,18 Z"
    fill="none"
    stroke="var(--gl-track, rgba(255,255,255,.08))"
    stroke-width="3"
  />

  <!-- the morphing, flowing loop -->
  <path
    class="gl-neural-path"
    d="M50,18 A34,34 0 0,1 77.71,66 A34,34 0 0,1 22.29,66 A34,34 0 0,1 50,18 Z"
    fill="none"
    stroke="url(#gl-neural-grad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-dasharray="44 154"
  />

  <circle class="gl-neural-node n1" cx="50"    cy="18" r="4" fill="var(--gl-b, #00F5D4)" filter="url(#gl-neural-glow)" />
  <circle class="gl-neural-node n2" cx="77.71" cy="66" r="4" fill="var(--gl-a, #7A40FF)" filter="url(#gl-neural-glow)" />
  <circle class="gl-neural-node n3" cx="22.29" cy="66" r="4" fill="var(--gl-a, #7A40FF)" filter="url(#gl-neural-glow)" />

  <style>
    .gl-neural-path, .gl-neural-node {
      transform-box: fill-box;
      transform-origin: center;
    }
    .gl-neural-path {
      animation:
        gl-neural-dash calc(var(--gl-duration, 1.6s) * 1.1) linear infinite,
        gl-neural-morph calc(var(--gl-duration, 1.6s) * 2.2) ease-in-out infinite;
    }
    @keyframes gl-neural-dash { to { stroke-dashoffset: -198; } }
    @keyframes gl-neural-morph {
      0%, 100% { d: path("M50,18 A34,34 0 0,1 77.71,66 A34,34 0 0,1 22.29,66 A34,34 0 0,1 50,18 Z"); }
      50%      { d: path("M50,18 A46,46 0 0,1 77.71,66 A46,46 0 0,1 22.29,66 A46,46 0 0,1 50,18 Z"); }
    }
    .gl-neural-node {
      animation: gl-neural-pulse calc(var(--gl-duration, 1.6s) * 1.1) ease-in-out infinite;
    }
    .gl-neural-node.n2 { animation-delay: calc(var(--gl-duration, 1.6s) * 0.37 * -1); }
    .gl-neural-node.n3 { animation-delay: calc(var(--gl-duration, 1.6s) * 0.74 * -1); }
    @keyframes gl-neural-pulse {
      0%, 100% { opacity: .45; transform: scale(.8); }
      50%      { opacity: 1;   transform: scale(1.25); }
    }
    @media (prefers-color-scheme: light) {
      .gl-neural { --gl-track: rgba(9, 10, 15, .10); }
    }
    @media (prefers-reduced-motion: reduce) {
      .gl-neural-path { animation: gl-neural-dash 3s linear infinite; }
      .gl-neural-node { animation: none; opacity: .85; }
    }
  </style>
</svg>
