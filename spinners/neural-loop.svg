<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="96"
  height="96"
  role="img"
  aria-label="Loading — GenLayer Neural Loop"
  class="gl-neural"
>
  <defs>
    <linearGradient id="gl-neural-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--gl-a, #71461E)" />
      <stop offset="50%" stop-color="var(--gl-b, #3C5872)" />
      <stop offset="100%" stop-color="var(--gl-a, #71461E)" />
    </linearGradient>
    <filter id="gl-nglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Heavy Pulse Logo in Center -->
  <g class="gl-logo-pulse" style="transform-box: fill-box; transform-origin: center; animation: gl-pulse-logo calc(var(--gl-duration, 1.6s) * 1.1) ease-in-out infinite alternate;">
    <g transform="translate(28, 28) scale(0.44)">
      <path d="M 46,10 L 10,90 L 46,78 L 30,62 L 46,46 Z M 54,10 L 90,90 L 54,78 L 70,62 L 54,46 Z" fill="var(--gl-a, #71461E)" opacity="0.85" />
      <path d="M 50,50 L 62,62 L 50,74 L 38,62 Z" fill="var(--gl-b, #3C5872)" filter="url(#gl-nglow)" />
    </g>
  </g>

  <!-- Thickened Tracks for high visibility -->
  <path d="M50,18 A40,40 0 0,1 77.71,66 A40,40 0 0,1 22.29,66 A40,40 0 0,1 50,18 Z" fill="none" stroke="var(--track, rgba(255,255,255,.08))" stroke-width="4" opacity="0.5"/>
  <path class="gl-neural-path" d="M50,18 A34,34 0 0,1 77.71,66 A34,34 0 0,1 22.29,66 A34,34 0 0,1 50,18 Z" fill="none" stroke="url(#gl-neural-grad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="60 120" style="transform-box: fill-box; transform-origin: center; animation: gl-dash calc(var(--gl-duration, 1.6s) * 1.1) linear infinite, gl-morph calc(var(--gl-duration, 1.6s) * 2.2) ease-in-out infinite;"/>
  
  <circle class="gl-neural-node n1" cx="50" cy="18" r="5" fill="var(--gl-b, #3C5872)" filter="url(#gl-nglow)" style="transform-box: fill-box; transform-origin: center; animation: gl-pulse-node calc(var(--gl-duration, 1.6s) * 1.1) ease-in-out infinite;"/>
  <circle class="gl-neural-node n2" cx="77.71" cy="66" r="5" fill="var(--gl-a, #71461E)" filter="url(#gl-nglow)" style="transform-box: fill-box; transform-origin: center; animation: gl-pulse-node calc(var(--gl-duration, 1.6s) * 1.1) ease-in-out infinite; animation-delay: calc(var(--gl-duration, 1.6s) * -0.37);"/>
  <circle class="gl-neural-node n3" cx="22.29" cy="66" r="5" fill="var(--gl-a, #71461E)" filter="url(#gl-nglow)" style="transform-box: fill-box; transform-origin: center; animation: gl-pulse-node calc(var(--gl-duration, 1.6s) * 1.1) ease-in-out infinite; animation-delay: calc(var(--gl-duration, 1.6s) * -0.74);"/>
  
  <style>
    @keyframes gl-pulse-logo {
      0% { transform: scale(0.9); opacity: 0.7; filter: drop-shadow(0 0 4px var(--gl-a, #71461E)); }
      100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 12px var(--gl-b, #3C5872)); }
    }
    @keyframes gl-dash { to { stroke-dashoffset: -198; } }
    @keyframes gl-morph {
      0%, 100% { d: path("M50,18 A34,34 0 0,1 77.71,66 A34,34 0 0,1 22.29,66 A34,34 0 0,1 50,18 Z"); }
      50%      { d: path("M50,18 A46,46 0 0,1 77.71,66 A46,46 0 0,1 22.29,66 A46,46 0 0,1 50,18 Z"); }
    }
    @keyframes gl-pulse-node {
      0%, 100% { opacity: .45; transform: scale(.8); }
      50%      { opacity: 1;   transform: scale(1.25); }
    }
    @media (prefers-reduced-motion: reduce) {
      .gl-neural-path { animation: gl-dash 3s linear infinite !important; }
      .gl-neural-node, .gl-logo-pulse { animation: none !important; opacity: .85; }
    }
  </style>
</svg>
